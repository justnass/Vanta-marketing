<title>Vanta Marketing</title>

  <header class="hero">
    <div class="logo">
      <img src="VANTAlogoblackbgpng.png" alt="logo" height="30%" width="30%">
    </div>

    <h1 class="headline">We make brands<br>impossible to ignore.</h1>

    <p class="subtext">Vanta Marketing creates high-impact visual content for brands and creators who want to stand out.</p>

    <a class="cta" href="mailto:vantamarketing.contact@gmail.com">Get in touch</a>
  </header>

  <main>
    <h2 class="section-title">Selected Work</h2>

    <section class="work-block">
      <h3 class="work-heading">Product Posters</h3>
      <div class="grid grid-2">
        <div class="card poster">
          <img src="pinkredbull2.png" alt="Example product poster">
        </div>
        <div class="card poster">
          <img src="sf90poster.png" alt="Example product poster">
        </div>
      </div>
    </section>

    <section class="work-block">
      <h3 class="work-heading">People/event Posters</h3>
      <div class="grid grid-2">
        <div class="card poster">
          <img src="khabibposter2.png" alt="Example event poster">
        </div>
        <div class="card poster">
          <img src="kendrick-affiche1.png" alt="Example event poster">
        </div>
      </div>
    </section>

    <section class="work-block">
      <h3 class="work-heading">Thumbnails</h3>
      <div class="grid grid-2">
        <div class="card thumb">
          <img src="Adobe-Alternatives-Final.png" alt="Example thumbnail">
        </div>
        <div class="card thumb">
          <img src="S22UVSA56.png" alt="Example thumbnail">
        </div>
      </div>
    </section>
  </main>
